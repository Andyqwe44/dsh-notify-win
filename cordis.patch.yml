# dsh-notify-win bundle patch: inserts the host notification plugin row.
#
# Applied after the base and web-app bundle layers. The profile's own
# cordis.patch.yml (and the home-level one) is applied afterwards and may:
#   - disable the plugin:   - id: dsh-notify-win
#                             disabled: true
#   - override texts:       - id: dsh-notify-win
#                             config:
#                               doneTitle: ...
#                               doneBody: ...
#                               questionTitle: ...
#                               questionBody: ...
#                               askTitle: ...
#                               askBody: ...
#                               dedupMs: 1500
- insert:
    - id: dsh-notify-win
      name: dsh-notify-win
