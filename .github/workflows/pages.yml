name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Deploy both docs/ (HTML + screenshots) and lib/ (hero/logo assets
      // referenced by index.html via ../lib/ paths).
      - name: Prepare pages artifact
        run: |
          rm -rf _page
          mkdir -p _page
          cp -r docs/* _page/
          cp -r lib/*.png lib/*.ico lib/*.svg _page/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _page
      - id: deployment
        uses: actions/deploy-pages@v4
